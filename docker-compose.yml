services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pr_sentinel
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
 
  app:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Inside Docker's network, "db" is the hostname of the db service
      # above -- NOT "localhost", since each container has its own
      # localhost. This is a very common first-time Docker networking gotcha.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pr_sentinel
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount the .pem key file in read-only, so the container can read
      # it without it being baked into the image itself (images can end
      # up pushed to a registry -- never bake secrets into them).
      - ./pr-sentinel-gayatri.2026-08-25.private-key.pem:/app/pr-sentinel-gayatri.2026-08-25.private-key.pem:ro
 
volumes:
  pg_data: